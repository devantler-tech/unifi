name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: "ci-${{ github.event.number || github.sha }}"
  cancel-in-progress: true

jobs:
  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation links
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@8d3327fe87f216d6e107941de4ce1ae019294cea  # v7.9.1
        with:
          enabled: "true"

      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true

      - name: Prepare disposable README defect
        run: |
          mkdir -p "$RUNNER_TEMP/retired-links-fixture/.github"
          cp README.md AGENTS.md "$RUNNER_TEMP/retired-links-fixture/"
          printf '\n[Retired catalogue](https://github.com/devantler-tech/reusable-workflows)\n' >> "$RUNNER_TEMP/retired-links-fixture/README.md"
          cp .github/retired-repo-links.json "$RUNNER_TEMP/retired-links-fixture/.github/retired-repo-links.json"

      - name: Reject the retired README link
        id: retired
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@8d3327fe87f216d6e107941de4ce1ae019294cea  # v7.9.1
        with:
          enabled: "true"
          working-directory: ${{ runner.temp }}/retired-links-fixture

      - name: Reject missing configuration
        id: missing
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@8d3327fe87f216d6e107941de4ce1ae019294cea  # v7.9.1
        with:
          enabled: "true"
          config-file: .github/missing-retired-repo-links.json

      - name: Verify negative action outcomes
        if: ${{ always() }}
        env:
          CLEAN_VALIDATED: ${{ steps.links.outputs.validated }}
          RETIRED_OUTCOME: ${{ steps.retired.outcome }}
          RETIRED_VALIDATED: ${{ steps.retired.outputs.validated }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_VALIDATED: ${{ steps.missing.outputs.validated }}
        run: |
          test "$CLEAN_VALIDATED" = true
          test "$RETIRED_OUTCOME" = failure
          test -z "$RETIRED_VALIDATED"
          test "$MISSING_OUTCOME" = failure
          test -z "$MISSING_VALIDATED"

      - name: Checkout released validator for diagnostic proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
          path: .retired-repo-links-validator
          persist-credentials: false

      - name: Verify exact failure codes and diagnostics
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          go -C .retired-repo-links-validator/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-repo-links" .
          bash scripts/test-retired-repo-links.sh "$RUNNER_TEMP/retired-repo-links"

  validate:
    name: Validate (Crossplane manifests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUSTOMIZE_VERSION: v5.8.1
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kustomize + kubeconform
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          sudo install -m 0755 kustomize kubeconform /usr/local/bin/

      - name: Build manifests
        run: kustomize build . > manifests.yaml

      - name: Validate manifests
        # Structural + Kubernetes-schema validation. The UniFi MR kinds are
        # CRDs from provider-upjet-unifi, validated authoritatively server-side
        # by the API server / Crossplane at apply time (and locally against the
        # provider CRDs — see AGENTS.md), so skip their missing client schemas here.
        run: kubeconform -strict -ignore-missing-schemas -summary -verbose manifests.yaml

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [validate, retired-repo-links]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/.github/actions/aggregate-job-checks@fca583ac795d56928c5b542944b6e0963ea1e270 # v7.8.5
        with:
          job-results: >-
            ${{ needs.validate.result }}
            ${{ needs.retired-repo-links.result }}
