name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # The field check reads the provider release from the Platform's main branch, and a
  # Platform provider bump triggers nothing here. Re-checking main daily means a
  # release that breaks these manifests turns main red within a day, with no push.
  schedule:
    - cron: "41 5 * * *"  # daily, 05:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "ci-${{ github.event.number || github.sha }}"
  cancel-in-progress: true

jobs:
  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation links
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@946fff9cb37042f4c26c3342665727e28bd66c01  # v22.3.0
        with:
          enabled: "true"

      - name: Require a complete scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true

      - name: Prepare disposable README defect
        run: |
          mkdir -p "$RUNNER_TEMP/retired-links-fixture/.github"
          cp README.md AGENTS.md "$RUNNER_TEMP/retired-links-fixture/"
          printf '\n[Retired catalogue](https://github.com/devantler-tech/reusable-workflows)\n' >> "$RUNNER_TEMP/retired-links-fixture/README.md"
          cp .github/retired-repo-links.json "$RUNNER_TEMP/retired-links-fixture/.github/retired-repo-links.json"

      - name: Reject the retired README link
        id: retired
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@946fff9cb37042f4c26c3342665727e28bd66c01  # v22.3.0
        with:
          enabled: "true"
          working-directory: ${{ runner.temp }}/retired-links-fixture

      - name: Reject missing configuration
        id: missing
        continue-on-error: true
        uses: devantler-tech/.github/actions/validate-retired-repo-links@946fff9cb37042f4c26c3342665727e28bd66c01  # v22.3.0
        with:
          enabled: "true"
          config-file: .github/missing-retired-repo-links.json

      - name: Verify negative action outcomes
        if: ${{ always() }}
        env:
          CLEAN_VALIDATED: ${{ steps.links.outputs.validated }}
          RETIRED_OUTCOME: ${{ steps.retired.outcome }}
          RETIRED_VALIDATED: ${{ steps.retired.outputs.validated }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_VALIDATED: ${{ steps.missing.outputs.validated }}
        run: |
          test "$CLEAN_VALIDATED" = true
          test "$RETIRED_OUTCOME" = failure
          test -z "$RETIRED_VALIDATED"
          test "$MISSING_OUTCOME" = failure
          test -z "$MISSING_VALIDATED"

      - name: Checkout released validator for diagnostic proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59  # v4.9.4
          path: .retired-repo-links-validator
          persist-credentials: false

      - name: Verify exact failure codes and diagnostics
        env:
          GOWORK: "off"
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          go -C .retired-repo-links-validator/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$RUNNER_TEMP/retired-repo-links" .
          bash scripts/test-retired-repo-links.sh "$RUNNER_TEMP/retired-repo-links"

  validate:
    name: Validate (Crossplane manifests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The CLI is downloaded from Crossplane's release host and checked against this digest
      # before it runs. The image supplies Crossplane's built-in schemas; keep it at the version
      # the Platform runs (its crossplane HelmRelease). The provider version is not pinned here:
      # the validator reads it from the Platform's Provider manifest.
      CROSSPLANE_CLI_VERSION: v2.5.0
      CROSSPLANE_CLI_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e
      CROSSPLANE_IMAGE: xpkg.crossplane.io/crossplane/crossplane:v2.4.3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Crossplane CLI
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crossplane" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_CLI_VERSION}/bin/linux_amd64/crossplane"
          echo "${CROSSPLANE_CLI_SHA256}  $RUNNER_TEMP/crossplane" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/crossplane"
          "$RUNNER_TEMP/crossplane" version --client

      - name: Build manifests
        # kubectl, with its built-in kustomize, is preinstalled on the runner.
        run: kubectl kustomize deploy > "$RUNNER_TEMP/manifests.yaml"

      - name: Validate manifests against the provider the Platform runs
        # Checks every field against the provider package the Platform pins, and fails on a
        # kind no schema covers (see scripts/validate-crossplane-schemas.sh and AGENTS.md).
        run: bash scripts/validate-crossplane-schemas.sh "$RUNNER_TEMP/crossplane" "$RUNNER_TEMP/manifests.yaml"

      - name: Check the validation catches seeded defects
        run: bash scripts/test-validate-crossplane-schemas.sh "$RUNNER_TEMP/crossplane" "$RUNNER_TEMP/manifests.yaml"

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [validate, retired-repo-links]
    permissions:
      actions: read
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/.github/actions/aggregate-job-checks@0e02148c251bcd65cfddc1cc7bec49ccce2eea42 # v22.7.0
        with:
          job-results: >-
            ${{ needs.validate.result }}
            ${{ needs.retired-repo-links.result }}
          # The check accepts only these events; scheduled and manual runs would fail on it.
          check-workflow-startup: ${{ contains(fromJSON('["pull_request","push","merge_group"]'), github.event_name) }}
