name: 🎉 Release

# Cuts the next release from main with semantic-release, through the organisation's shared
# create-release workflow. It creates the `v<semver>` tag with the organisation's release App:
# only the release process may create a release tag, and release tags cannot be moved or
# deleted (organisation rulesets). Each tag triggers cd.yaml, which publishes deploy/ as the
# signed manifests artifact the platform follows (monorepo ADR 0017 and ADR 0019).
#
# `feat` cuts a minor release, `fix` a patch and a breaking change (`!` or BREAKING CHANGE) a
# major; `docs`, `ci`, `chore` and Dependabot's `build(deps)` cut nothing (see .releaserc).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # id-token: write lets the shared release workflow prove its identity to the
    # GitHub token broker (devantler-tech/monorepo ADR 0020) instead of minting
    # from the App key. Granting it is harmless until the workflow asks for it,
    # and it must be here first: a reusable job that asks for more than its
    # caller grants fails at startup.
    permissions:
      id-token: write
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@61d8f70f25d7d5deb8bd914136b329b5a59ff43b # v22.7.4
    with:
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
